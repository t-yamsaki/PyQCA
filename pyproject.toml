[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pyqca"
version = "0.2.0"
description = "Python-native toolkit for csQCA, mvQCA, fsQCA, mixed-type QCA, and threshold-sweep analysis"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
authors = [
    { name = "Taishi Yamasaki" },
]
keywords = [
    "QCA",
    "qualitative comparative analysis",
    "fuzzy set",
    "multi-value QCA",
    "Boolean minimization",
    "threshold sweep",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
]

[project.urls]
Homepage = "https://github.com/t-yamsaki/PyQCA"
Repository = "https://github.com/t-yamsaki/PyQCA"
Issues = "https://github.com/t-yamsaki/PyQCA/issues"

[project.optional-dependencies]
viz = [
    "matplotlib>=3.8",
]
mlqca = [
    "scikit-learn>=1.4",
    "xgboost>=2.0",
]
mlqca-explain = [
    "scikit-learn>=1.4",
    "shap>=0.46",
    "xgboost>=2.0",
]
docs = [
    "furo==2025.12.19",
    "sphinx==9.1.0",
    "sphinx-copybutton==0.5.2",
]
test = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
]
dev = [
    "pyqca[docs,test,viz]",
    "build>=1.2",
    "flake8>=7.0",
    "isort>=5.13",
    "ruff>=0.4",
    "twine>=5.0",
    "mypy>=1.9",
    "pandas-stubs>=2.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/qca"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
src = ["src", "tests"]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["qca"]

[tool.isort]
profile = "black"
line_length = 88
src_paths = ["src", "tests"]
known_first_party = ["qca"]
combine_as_imports = true

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
